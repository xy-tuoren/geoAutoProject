[project]
name = "geoauto-u2-bridge"
version = "0.1.0"
description = "Strict Python uiautomator2 bridge for geoAutoProject"
requires-python = ">=3.11,<3.12"
dependencies = [
  "onnxruntime>=1.20,<2",
  "pillow>=11,<13",
  "rapidocr>=3.4,<4",
  "uiautomator2>=3.4,<4",
]

[dependency-groups]
dev = [
  "pyinstaller>=6.10,<7",
  "pytest>=8,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geoauto_u2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
