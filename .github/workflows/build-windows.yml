name: Windows build and COS release
run-name: >-
  ${{ inputs.release_tag != '' && format('COS deployment recovery · {0} · {1}', inputs.release_tag, inputs.deploy_from)
      || startsWith(github.ref, 'refs/tags/v') && format('Windows release · {0}', github.ref_name)
      || format('Windows installer build · {0}', github.ref_name) }}

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Redeploy an existing stable Release to COS without rebuilding (leave blank to build only)
        required: false
        type: string
      deploy_from:
        description: Recovery stage for an existing Release (later stages still verify all assets)
        required: false
        type: choice
        default: upload
        options:
          - upload
          - verify
          - publish
      upload_runner:
        description: COS upload node (Windows by default; Ubuntu/local for manual recovery)
        required: false
        type: choice
        default: github_windows
        options:
          - github_windows
          - github_hosted
          - local_recovery
  push:
    tags:
      - "v*"

# Hold the production lock through COS publishing, cleanup and the legacy bridge.
concurrency:
  group: ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != '') && 'windows-update-production' || format('windows-build-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Build Windows installer
    if: inputs.release_tag == ''
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          working-directory: python
          python-version: "3.11"
          enable-cache: true

      - name: Install Node dependencies
        run: npm ci

      - name: Validate Python lock
        working-directory: python
        run: uv lock --check

      - name: Run Python tests
        working-directory: python
        run: |
          uv sync --locked
          uv run --locked pytest -q

      - name: Run Node checks
        run: |
          npm run check
          npm test

      - name: Validate release tag matches application version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $packageVersion = node -p "require('./package.json').version"
          $expectedTag = "v$packageVersion"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Release tag '$env:GITHUB_REF_NAME' must match package version '$expectedTag'."
          }

      - name: Build NSIS installer
        run: npm run dist -- --win nsis --x64 --publish never

      - name: Validate auto-update metadata
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/latest.yml")) {
            throw "dist/latest.yml was not generated; Windows auto-update would be unavailable."
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: question-automation-windows-x64
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          if-no-files-found: error
          retention-days: 14

  release-windows:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: question-automation-windows-x64
          path: release-assets

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -d '' files < <(find release-assets -type f \( -name '*.exe' -o -name '*.blockmap' -o -name 'latest.yml' \) -print0)
          if (( ${#files[@]} == 0 )); then
            echo "No Windows release assets were downloaded." >&2
            exit 1
          fi
          if [[ ! -f release-assets/latest.yml ]]; then
            echo "latest.yml is missing from the Windows release assets." >&2
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            release_flags=()
            if [[ "$GITHUB_REF_NAME" == *-* ]]; then
              release_flags+=(--prerelease)
            fi
            gh release create "$GITHUB_REF_NAME" "${files[@]}" \
              --verify-tag \
              --generate-notes \
              --title "$GITHUB_REF_NAME" \
              "${release_flags[@]}" \
              --repo "$GITHUB_REPOSITORY"
          fi

  deploy-windows-update:
    name: Deploy COS update feed
    if: always() && !cancelled() && ((startsWith(github.ref, 'refs/tags/v') && needs.build-windows.result == 'success') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '' && needs.build-windows.result == 'skipped'))
    needs: build-windows
    # Tag pushes have no workflow_dispatch inputs: the empty value must also select Windows.
    runs-on: ${{ inputs.upload_runner == 'local_recovery' && fromJSON('["self-hosted", "geoauto-cos-recovery"]') || inputs.upload_runner == 'github_hosted' && 'ubuntu-latest' || 'windows-latest' }}
    timeout-minutes: 75
    permissions:
      contents: read
    env:
      TENCENT_COS_SECRET_ID: ${{ secrets.TENCENT_COS_SECRET_ID }}
      TENCENT_COS_SECRET_KEY: ${{ secrets.TENCENT_COS_SECRET_KEY }}
      TENCENT_COS_BUCKET: ${{ secrets.TENCENT_COS_BUCKET }}
      TENCENT_COS_REGION: ${{ secrets.TENCENT_COS_REGION }}
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      COS_DEPLOY_REPORT_DIR: cos-deployment-report
      PYTHONUTF8: "1"

    steps:
      - name: Checkout deployment scripts
        uses: actions/checkout@v6

      - name: Download Windows installer
        if: inputs.release_tag == ''
        uses: actions/download-artifact@v4
        with:
          name: question-automation-windows-x64
          path: release-assets

      - name: Download existing Release for deployment
        if: inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease')" = false
          if [[ "${{ inputs.upload_runner }}" == 'local_recovery' ]]; then
            : "${GEOAUTO_RECOVERY_ASSET_DIR:?Prefetch the exact Release assets before starting the ephemeral runner}"
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > release-asset-digests.json
            mkdir -p release-assets
            uv run --no-project --python 3.11 python - <<'PY'
          import hashlib, json, os, pathlib, shutil
          root = pathlib.Path(os.environ['GEOAUTO_RECOVERY_ASSET_DIR'])
          version = os.environ['RELEASE_TAG'][1:]
          names = {'latest.yml', f'question-automation-electron-setup-{version}.exe', f'question-automation-electron-setup-{version}.exe.blockmap'}
          assets = {a['name']: a for a in json.loads(pathlib.Path('release-asset-digests.json').read_text())['assets']}
          for name in names:
              source = root / name
              expected = assets[name]
              with source.open('rb') as stream:
                  digest = 'sha256:' + hashlib.file_digest(stream, 'sha256').hexdigest()
              if source.stat().st_size != expected['size'] or digest != expected.get('digest'):
                  raise SystemExit('Cached Release asset differs from GitHub: ' + name)
              shutil.copyfile(source, pathlib.Path('release-assets') / name)
          PY
          fi
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir release-assets \
            --skip-existing \
            --pattern "question-automation-electron-setup-${RELEASE_TAG#v}.exe" \
            --pattern "question-automation-electron-setup-${RELEASE_TAG#v}.exe.blockmap" --pattern latest.yml
          grep -Fx "version: ${RELEASE_TAG#v}" release-assets/latest.yml

      - name: Set up Python
        if: inputs.upload_runner != 'local_recovery'
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up isolated Python on the local recovery runner
        if: inputs.upload_runner == 'local_recovery'
        shell: bash
        run: |
          set -euo pipefail
          command -v uv
          uv venv --seed --python 3.11 "$RUNNER_TEMP/cos-python"
          echo "$RUNNER_TEMP/cos-python/bin" >> "$GITHUB_PATH"

      - name: Validate COS deployment configuration
        shell: bash
        run: |
          test -n "$TENCENT_COS_SECRET_ID"
          test -n "$TENCENT_COS_SECRET_KEY"
          test -n "$TENCENT_COS_BUCKET"
          test -n "$TENCENT_COS_REGION"
          test -f release-assets/latest.yml
          compgen -G 'release-assets/*.exe' > /dev/null
          compgen -G 'release-assets/*.blockmap' > /dev/null

      - name: Install deployment dependencies
        run: python -m pip install -r scripts/requirements-cos-deploy.txt

      - name: Upload or reuse verified versioned assets
        id: upload
        if: inputs.release_tag == '' || inputs.deploy_from == '' || inputs.deploy_from == 'upload'
        # Observed hosted throughput takes about 40 minutes for a 211 MiB installer.
        # The uploader still stops after 180 seconds with no successful part progress.
        timeout-minutes: 60
        run: python scripts/deploy_cos_update.py upload

      - name: Verify public downloads before publishing
        id: verify
        if: inputs.release_tag == '' || inputs.deploy_from != 'publish'
        timeout-minutes: 2
        run: python scripts/deploy_cos_update.py verify

      - name: Publish fixed installer and update manifest
        id: publish
        timeout-minutes: 3
        run: python scripts/deploy_cos_update.py publish

      - name: Summarize COS deployment and recovery
        if: always()
        continue-on-error: true
        env:
          COS_UPLOAD_RESULT: ${{ steps.upload.outcome }}
          COS_VERIFY_RESULT: ${{ steps.verify.outcome }}
          COS_PUBLISH_RESULT: ${{ steps.publish.outcome }}
        run: python scripts/summarize_cos_deployment.py

      - name: Save deployment diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: cos-deployment-${{ github.run_id }}-${{ github.run_attempt }}
          path: cos-deployment-report/
          if-no-files-found: warn
          retention-days: 14

  cleanup-windows-update:
    name: Clean up old COS packages
    if: always() && !cancelled() && needs.deploy-windows-update.result == 'success'
    needs: deploy-windows-update
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      TENCENT_COS_SECRET_ID: ${{ secrets.TENCENT_COS_SECRET_ID }}
      TENCENT_COS_SECRET_KEY: ${{ secrets.TENCENT_COS_SECRET_KEY }}
      TENCENT_COS_BUCKET: ${{ secrets.TENCENT_COS_BUCKET }}
      TENCENT_COS_REGION: ${{ secrets.TENCENT_COS_REGION }}
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - name: Checkout deployment scripts
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install deployment dependencies
        run: python -m pip install -r scripts/requirements-cos-deploy.txt
      - name: Retain five highest release versions
        run: python scripts/deploy_cos_update.py cleanup

  bridge-legacy-windows-update:
    name: Sync legacy update feed
    if: always() && !cancelled() && needs.deploy-windows-update.result == 'success'
    needs: deploy-windows-update
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      UPDATE_SERVER_HOST: ${{ secrets.UPDATE_SERVER_HOST }}
      UPDATE_SERVER_USER: ${{ secrets.UPDATE_SERVER_USER }}
      UPDATE_SERVER_SSH_PASSWORD: ${{ secrets.UPDATE_SERVER_SSH_PASSWORD }}
      TENCENT_COS_BUCKET: ${{ secrets.TENCENT_COS_BUCKET }}
      TENCENT_COS_REGION: ${{ secrets.TENCENT_COS_REGION }}
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

    steps:
      - name: Download Windows update metadata
        if: inputs.release_tag == ''
        uses: actions/download-artifact@v4
        with:
          name: question-automation-windows-x64
          path: release-assets

      - name: Download existing Release metadata
        if: inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir release-assets --pattern latest.yml
          grep -Fx "version: ${RELEASE_TAG#v}" release-assets/latest.yml

      - name: Point legacy clients to COS
        shell: bash
        run: |
          set -euo pipefail
          test -n "$UPDATE_SERVER_HOST"
          test -n "$UPDATE_SERVER_USER"
          test -n "$UPDATE_SERVER_SSH_PASSWORD"
          # A rerun of only this failed job may follow a newer successful release.
          base_url="https://${TENCENT_COS_BUCKET}.cos.${TENCENT_COS_REGION}.myqcloud.com/geo-updates/win"
          curl --fail --silent --show-error --retry 2 --connect-timeout 10 --max-time 30 \
            "$base_url/latest.yml" --output deployed-latest.yml
          cmp release-assets/latest.yml deployed-latest.yml
          installer="question-automation-electron-setup-${RELEASE_TAG#v}.exe"
          cos_url="https://${TENCENT_COS_BUCKET}.cos.${TENCENT_COS_REGION}.myqcloud.com/geo-updates/win/$installer"
          sed -E \
            -e "s|^([[:space:]]*-[[:space:]]*)url: .*\\.exe$|\\1url: $cos_url|" \
            -e "s|^path: .*\\.exe$|path: $cos_url|" \
            release-assets/latest.yml > legacy-latest.yml
          grep -F "url: $cos_url" legacy-latest.yml
          grep -F "path: $cos_url" legacy-latest.yml
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          export SSHPASS="$UPDATE_SERVER_SSH_PASSWORD"
          remote="$UPDATE_SERVER_USER@$UPDATE_SERVER_HOST"
          ssh_options=(-o StrictHostKeyChecking=accept-new -o PreferredAuthentications=password -o PubkeyAuthentication=no -o NumberOfPasswordPrompts=1 -o ConnectTimeout=20)
          timeout 30s sshpass -e scp "${ssh_options[@]}" legacy-latest.yml "$remote:/var/www/geo-updates/win/latest.yml.next"
          timeout 30s sshpass -e ssh "${ssh_options[@]}" "$remote" "mv '/var/www/geo-updates/win/latest.yml.next' '/var/www/geo-updates/win/latest.yml'"
