name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          working-directory: python
          python-version: "3.11"
          enable-cache: true

      - name: Install Node dependencies
        run: npm ci

      - name: Validate Python lock
        working-directory: python
        run: uv lock --check

      - name: Run Python tests
        working-directory: python
        run: |
          uv sync --locked
          uv run --locked pytest -q

      - name: Run Node checks
        run: |
          npm run check
          npm test

      - name: Validate release tag matches application version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $packageVersion = node -p "require('./package.json').version"
          $expectedTag = "v$packageVersion"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Release tag '$env:GITHUB_REF_NAME' must match package version '$expectedTag'."
          }

      - name: Build NSIS installer
        run: npm run dist -- --win nsis --x64 --publish never

      - name: Validate auto-update metadata
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/latest.yml")) {
            throw "dist/latest.yml was not generated; Windows auto-update would be unavailable."
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: question-automation-windows-x64
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          if-no-files-found: error
          retention-days: 14

  release-windows:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: question-automation-windows-x64
          path: release-assets

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -d '' files < <(find release-assets -type f \( -name '*.exe' -o -name '*.blockmap' -o -name 'latest.yml' \) -print0)
          if (( ${#files[@]} == 0 )); then
            echo "No Windows release assets were downloaded." >&2
            exit 1
          fi
          if [[ ! -f release-assets/latest.yml ]]; then
            echo "latest.yml is missing from the Windows release assets." >&2
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            release_flags=()
            if [[ "$GITHUB_REF_NAME" == *-* ]]; then
              release_flags+=(--prerelease)
            fi
            gh release create "$GITHUB_REF_NAME" "${files[@]}" \
              --verify-tag \
              --generate-notes \
              --title "$GITHUB_REF_NAME" \
              "${release_flags[@]}" \
              --repo "$GITHUB_REPOSITORY"
          fi

  deploy-windows-update:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      UPDATE_SERVER_HOST: ${{ secrets.UPDATE_SERVER_HOST }}
      UPDATE_SERVER_USER: ${{ secrets.UPDATE_SERVER_USER }}
      UPDATE_SERVER_SSH_PASSWORD: ${{ secrets.UPDATE_SERVER_SSH_PASSWORD }}

    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: question-automation-windows-x64
          path: release-assets

      - name: Validate update deployment configuration
        shell: bash
        run: |
          test -n "$UPDATE_SERVER_HOST"
          test -n "$UPDATE_SERVER_USER"
          test -n "$UPDATE_SERVER_SSH_PASSWORD"
          test -f release-assets/latest.yml
          compgen -G 'release-assets/*.exe' > /dev/null
          compgen -G 'release-assets/*.blockmap' > /dev/null

      - name: Publish Windows auto-update files to server
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          export SSHPASS="$UPDATE_SERVER_SSH_PASSWORD"
          remote="$UPDATE_SERVER_USER@$UPDATE_SERVER_HOST"
          release_dir='/var/www/geo-updates/win'
          staging_dir="$release_dir/.incoming-${GITHUB_RUN_ID}"
          server_assets_dir='server-update-assets'
          server_installer='question-automation-electron-setup.exe'
          installer_source=$(find release-assets -maxdepth 1 -type f -name '*.exe' -print -quit)
          blockmap_source="${installer_source}.blockmap"
          test -n "$installer_source"
          test -f "$blockmap_source"
          rm -rf "$server_assets_dir"
          mkdir -p "$server_assets_dir"
          cp "$installer_source" "$server_assets_dir/$server_installer"
          cp "$blockmap_source" "$server_assets_dir/${server_installer}.blockmap"
          sed -E \
            -e "s|^([[:space:]]*-[[:space:]]*)url: .*\\.exe$|\\1url: $server_installer|" \
            -e "s|^path: .*\\.exe$|path: $server_installer|" \
            release-assets/latest.yml > "$server_assets_dir/latest.yml"
          grep -F "url: $server_installer" "$server_assets_dir/latest.yml"
          grep -F "path: $server_installer" "$server_assets_dir/latest.yml"
          ssh_options=(-o StrictHostKeyChecking=accept-new -o PreferredAuthentications=password -o PubkeyAuthentication=no -o NumberOfPasswordPrompts=1 -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=2)
          timeout 30s sshpass -e ssh "${ssh_options[@]}" "$remote" "mkdir -p '$staging_dir'"
          timeout 15m sshpass -e scp "${ssh_options[@]}" "$server_assets_dir/$server_installer" "$server_assets_dir/${server_installer}.blockmap" "$server_assets_dir/latest.yml" "$remote:$staging_dir/"
          timeout 30s sshpass -e ssh "${ssh_options[@]}" "$remote" "set -eu; test -f '$staging_dir/latest.yml'; test -f '$staging_dir/$server_installer'; test -f '$staging_dir/${server_installer}.blockmap'; cp '$staging_dir/$server_installer' '$release_dir/$server_installer.next'; cp '$staging_dir/${server_installer}.blockmap' '$release_dir/${server_installer}.blockmap.next'; mv '$release_dir/$server_installer.next' '$release_dir/$server_installer'; mv '$release_dir/${server_installer}.blockmap.next' '$release_dir/${server_installer}.blockmap'; cp '$staging_dir/latest.yml' '$release_dir/latest.yml.next'; mv '$release_dir/latest.yml.next' '$release_dir/latest.yml'; find '$release_dir' -maxdepth 1 -type f \( -name '*.exe' -o -name '*.blockmap' \) ! -name '$server_installer' ! -name '${server_installer}.blockmap' -delete; rm -rf '$staging_dir'"
