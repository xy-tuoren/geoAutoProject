name: Build Windows

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Redeploy an existing stable Release to COS without rebuilding (leave blank to build only)
        required: false
        type: string
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    if: inputs.release_tag == ''
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          working-directory: python
          python-version: "3.11"
          enable-cache: true

      - name: Install Node dependencies
        run: npm ci

      - name: Validate Python lock
        working-directory: python
        run: uv lock --check

      - name: Run Python tests
        working-directory: python
        run: |
          uv sync --locked
          uv run --locked pytest -q

      - name: Run Node checks
        run: |
          npm run check
          npm test

      - name: Validate release tag matches application version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $packageVersion = node -p "require('./package.json').version"
          $expectedTag = "v$packageVersion"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Release tag '$env:GITHUB_REF_NAME' must match package version '$expectedTag'."
          }

      - name: Build NSIS installer
        run: npm run dist -- --win nsis --x64 --publish never

      - name: Validate auto-update metadata
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/latest.yml")) {
            throw "dist/latest.yml was not generated; Windows auto-update would be unavailable."
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: question-automation-windows-x64
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          if-no-files-found: error
          retention-days: 14

  release-windows:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: question-automation-windows-x64
          path: release-assets

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -d '' files < <(find release-assets -type f \( -name '*.exe' -o -name '*.blockmap' -o -name 'latest.yml' \) -print0)
          if (( ${#files[@]} == 0 )); then
            echo "No Windows release assets were downloaded." >&2
            exit 1
          fi
          if [[ ! -f release-assets/latest.yml ]]; then
            echo "latest.yml is missing from the Windows release assets." >&2
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            release_flags=()
            if [[ "$GITHUB_REF_NAME" == *-* ]]; then
              release_flags+=(--prerelease)
            fi
            gh release create "$GITHUB_REF_NAME" "${files[@]}" \
              --verify-tag \
              --generate-notes \
              --title "$GITHUB_REF_NAME" \
              "${release_flags[@]}" \
              --repo "$GITHUB_REPOSITORY"
          fi

  deploy-windows-update:
    if: always() && !cancelled() && ((startsWith(github.ref, 'refs/tags/v') && needs.build-windows.result == 'success') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '' && needs.build-windows.result == 'skipped'))
    needs: build-windows
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      TENCENT_COS_SECRET_ID: ${{ secrets.TENCENT_COS_SECRET_ID }}
      TENCENT_COS_SECRET_KEY: ${{ secrets.TENCENT_COS_SECRET_KEY }}
      TENCENT_COS_BUCKET: ${{ secrets.TENCENT_COS_BUCKET }}
      TENCENT_COS_REGION: ${{ secrets.TENCENT_COS_REGION }}
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

    steps:
      - name: Download Windows installer
        if: inputs.release_tag == ''
        uses: actions/download-artifact@v4
        with:
          name: question-automation-windows-x64
          path: release-assets

      - name: Download existing Release for deployment
        if: inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease')" = false
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir release-assets \
            --pattern "question-automation-electron-setup-${RELEASE_TAG#v}.exe" \
            --pattern "question-automation-electron-setup-${RELEASE_TAG#v}.exe.blockmap" --pattern latest.yml
          grep -Fx "version: ${RELEASE_TAG#v}" release-assets/latest.yml

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Validate COS deployment configuration
        shell: bash
        run: |
          test -n "$TENCENT_COS_SECRET_ID"
          test -n "$TENCENT_COS_SECRET_KEY"
          test -n "$TENCENT_COS_BUCKET"
          test -n "$TENCENT_COS_REGION"
          test -f release-assets/latest.yml
          compgen -G 'release-assets/*.exe' > /dev/null
          compgen -G 'release-assets/*.blockmap' > /dev/null

      - name: Install Tencent COS SDK
        run: python -m pip install cos-python-sdk-v5==1.9.44

      - name: Publish Windows auto-update files to COS
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob
          import os
          import re
          import threading
          import time
          from pathlib import Path

          from qcloud_cos import CosConfig, CosS3Client

          def error_reason(error):
              # Classify the wrapped requests exception without logging URLs, signatures or credentials.
              message = str(error).lower()
              for reason, markers in (
                  ("write_timeout", ("write operation timed out",)),
                  ("read_timeout", ("read timed out", "readtimeout")),
                  ("connect_timeout", ("connecttimeout", "connection timed out")),
                  ("dns_error", ("nameresolution", "name resolution", "getaddrinfo")),
                  ("tls_error", ("sslerror", "certificate verify failed")),
                  ("connection_reset", ("connection reset", "broken pipe", "remote end closed")),
                  ("timeout", ("timeout", "timed out")),
                  ("connection_error", ("connectionerror", "connection aborted", "failed to establish")),
              ):
                  if any(marker in message for marker in markers):
                      return reason
              return "unclassified_client_or_service_error"

          def progress_for(filename):
              last_report = 0.0
              lock = threading.Lock()
              def report(finished, total):
                  nonlocal last_report
                  with lock:
                      now = time.monotonic()
                      if now - last_report >= 30 or finished == total:
                          print(f"COS upload progress: {filename} {finished}/{total} bytes", flush=True)
                          last_report = now
              return report

          class ReleaseCosClient(CosS3Client):
              def upload_part(self, *args, **kwargs):
                  try:
                      return super().upload_part(*args, **kwargs)
                  except Exception as error:
                      # The SDK thread pool hides the original exception. Log only safe diagnostics.
                      status = getattr(error, "get_status_code", lambda: "unknown")()
                      code = getattr(error, "get_error_code", lambda: type(error).__name__)()
                      part = kwargs.get("PartNumber", args[3] if len(args) > 3 else "unknown")
                      reason = error_reason(error)
                      self.part_error_reasons.append(reason)
                      print(f"COS part upload failed: part={part}, status={status}, code={code}, reason={reason}", flush=True)
                      raise

          bucket = os.environ["TENCENT_COS_BUCKET"]
          region = os.environ["TENCENT_COS_REGION"]
          client = ReleaseCosClient(CosConfig(
              Region=region,
              SecretId=os.environ["TENCENT_COS_SECRET_ID"],
              SecretKey=os.environ["TENCENT_COS_SECRET_KEY"],
              Scheme="https",
              Timeout=(30, 60),
          ), retry=1)
          installer = Path(glob.glob("release-assets/*.exe")[0])
          blockmap = Path(f"{installer}.blockmap")
          metadata = Path("release-assets/latest.yml")
          prefix = "geo-updates/win/"

          def upload_asset(asset, content_type):
              transient_errors = {"write_timeout", "read_timeout", "connect_timeout", "dns_error",
                                  "connection_reset", "connection_error", "timeout"}
              for attempt in range(1, 4):
                  client.part_error_reasons = []
                  print(f"COS uploading: {asset.name} ({asset.stat().st_size} bytes), attempt={attempt}/3", flush=True)
                  try:
                      client.upload_file(
                          Bucket=bucket,
                          Key=f"{prefix}{asset.name}",
                          LocalFilePath=str(asset),
                          # Keep each TLS write small on the runner-to-COS public network path.
                          PartSize=1,
                          MAXThread=3,
                          EnableMD5=True,
                          progress_callback=progress_for(asset.name),
                          ACL="public-read",
                          ContentType=content_type,
                          CacheControl="public, max-age=31536000, immutable",
                      )
                      return
                  except Exception as error:
                      reasons = set(client.part_error_reasons) or {error_reason(error)}
                      if attempt == 3 or not reasons <= transient_errors:
                          raise
                      print(f"COS resuming verified parts after transient failure: {sorted(reasons)}", flush=True)
                      time.sleep(attempt * 2)

          for asset, content_type in (
              (installer, "application/vnd.microsoft.portable-executable"),
              (blockmap, "application/octet-stream"),
          ):
              upload_asset(asset, content_type)

          print("COS copying verified installer to fixed download key inside COS", flush=True)
          client.copy_object(
              Bucket=bucket,
              Key=f"{prefix}question-automation-electron-setup.exe",
              CopySource={"Bucket": bucket, "Region": region, "Key": f"{prefix}{installer.name}"},
              CopyStatus="Replaced",
              ACL="public-read",
              ContentType="application/vnd.microsoft.portable-executable",
              CacheControl="no-cache",
          )

          print("COS publishing latest.yml after all installer uploads completed", flush=True)
          with metadata.open("rb") as body:
              client.put_object(
                  Bucket=bucket,
                  Key=f"{prefix}latest.yml",
                  Body=body,
                  EnableMD5=True,
                  ACL="public-read",
                  ContentType="application/yaml",
                  CacheControl="no-cache, no-store, must-revalidate",
              )

          versioned_installers = []
          marker = ""
          while True:
              response = client.list_objects(
                  Bucket=bucket,
                  Prefix=f"{prefix}question-automation-electron-setup-",
                  Marker=marker,
                  MaxKeys=1000,
              )
              for item in response.get("Contents", []):
                  filename = item["Key"].removeprefix(prefix)
                  if re.fullmatch(r"question-automation-electron-setup-.+\.exe", filename):
                      versioned_installers.append((item["LastModified"], item["Key"]))
              if str(response.get("IsTruncated", "false")).lower() != "true":
                  break
              marker = response["NextMarker"]

          stale_installers = sorted(versioned_installers, reverse=True)[5:]
          for _, installer_key in stale_installers:
              assert installer_key.startswith(f"{prefix}question-automation-electron-setup-")
              assert installer_key.endswith(".exe")
              client.delete_object(Bucket=bucket, Key=f"{installer_key}.blockmap")
              client.delete_object(Bucket=bucket, Key=installer_key)
              print(f"deleted stale COS release {Path(installer_key).name}")
          PY

      - name: Verify public COS update files
        shell: bash
        run: |
          set -euo pipefail
          installer=$(find release-assets -maxdepth 1 -type f -name '*.exe' -printf '%f\n' -quit)
          base_url="https://${TENCENT_COS_BUCKET}.cos.${TENCENT_COS_REGION}.myqcloud.com/geo-updates/win"
          curl --fail --silent --show-error --retry 3 --range 0-0 "$base_url/$installer" >/dev/null
          curl --fail --silent --show-error --retry 3 --range 0-0 "$base_url/${installer}.blockmap" >/dev/null
          curl --fail --silent --show-error --retry 3 --range 0-0 "$base_url/question-automation-electron-setup.exe" >/dev/null
          curl --fail --silent --show-error --retry 3 "$base_url/latest.yml" --output deployed-latest.yml
          cmp release-assets/latest.yml deployed-latest.yml

  bridge-legacy-windows-update:
    if: always() && !cancelled() && needs.deploy-windows-update.result == 'success'
    needs: deploy-windows-update
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      UPDATE_SERVER_HOST: ${{ secrets.UPDATE_SERVER_HOST }}
      UPDATE_SERVER_USER: ${{ secrets.UPDATE_SERVER_USER }}
      UPDATE_SERVER_SSH_PASSWORD: ${{ secrets.UPDATE_SERVER_SSH_PASSWORD }}
      TENCENT_COS_BUCKET: ${{ secrets.TENCENT_COS_BUCKET }}
      TENCENT_COS_REGION: ${{ secrets.TENCENT_COS_REGION }}
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

    steps:
      - name: Download Windows update metadata
        if: inputs.release_tag == ''
        uses: actions/download-artifact@v4
        with:
          name: question-automation-windows-x64
          path: release-assets

      - name: Download existing Release metadata
        if: inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir release-assets --pattern latest.yml
          grep -Fx "version: ${RELEASE_TAG#v}" release-assets/latest.yml

      - name: Point legacy clients to COS
        shell: bash
        run: |
          set -euo pipefail
          test -n "$UPDATE_SERVER_HOST"
          test -n "$UPDATE_SERVER_USER"
          test -n "$UPDATE_SERVER_SSH_PASSWORD"
          installer="question-automation-electron-setup-${RELEASE_TAG#v}.exe"
          cos_url="https://${TENCENT_COS_BUCKET}.cos.${TENCENT_COS_REGION}.myqcloud.com/geo-updates/win/$installer"
          sed -E \
            -e "s|^([[:space:]]*-[[:space:]]*)url: .*\\.exe$|\\1url: $cos_url|" \
            -e "s|^path: .*\\.exe$|path: $cos_url|" \
            release-assets/latest.yml > legacy-latest.yml
          grep -F "url: $cos_url" legacy-latest.yml
          grep -F "path: $cos_url" legacy-latest.yml
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          export SSHPASS="$UPDATE_SERVER_SSH_PASSWORD"
          remote="$UPDATE_SERVER_USER@$UPDATE_SERVER_HOST"
          ssh_options=(-o StrictHostKeyChecking=accept-new -o PreferredAuthentications=password -o PubkeyAuthentication=no -o NumberOfPasswordPrompts=1 -o ConnectTimeout=20)
          timeout 30s sshpass -e scp "${ssh_options[@]}" legacy-latest.yml "$remote:/var/www/geo-updates/win/latest.yml.next"
          timeout 30s sshpass -e ssh "${ssh_options[@]}" "$remote" "mv '/var/www/geo-updates/win/latest.yml.next' '/var/www/geo-updates/win/latest.yml'"
